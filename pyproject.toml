[project]
name = "dezero-engine"
version = "0.1.0"
description = "A lightweight autograd engine built from scratch in Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pytest>=9.1.1",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dezero"]
